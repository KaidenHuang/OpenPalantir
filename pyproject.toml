[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
]
ignore = [
    "E501", # line too long
    "N801", # class name should use CapWords (for Pydantic models)
    "N806", # variable in function should be lowercase
]
exclude = ["**/venv/**", "**/__pycache__/**", "**/node_modules/**"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: 单元测试（不依赖外部服务）",
    "integration: 集成测试（需要 Neo4j/Redis/LLM 服务）",
    "slow: 耗时测试",
]